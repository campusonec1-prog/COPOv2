version: '3.9'

# =============================================================
# COPO - Production Docker Compose
# Usage:
#   docker compose --env-file .env up -d
# =============================================================

services:

  # -------------------------
  # MySQL Database
  # -------------------------
  mysql:
    image: mysql:8.0
    container_name: copo-mysql
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: copo3
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./SQL Dump/copo3:/docker-entrypoint-initdb.d:ro   # Auto-import SQL dumps on first run
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_PASSWORD}"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - copo-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # -------------------------
  # Spring Boot Application
  # -------------------------
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: copo-app
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "${PORT:-9091}:${PORT:-9091}"
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      PORT: ${PORT:-9091}
      DATABASE_URL: jdbc:mysql://mysql:3306/copo3?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&characterEncoding=UTF-8
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      ADMIN_USERNAME: ${ADMIN_USERNAME}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      LOG_LEVEL: ${LOG_LEVEL:-WARN}
    volumes:
      - app_logs:/app/logs
    networks:
      - copo-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:${PORT:-9091}/copo/actuator/health"]

      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

# -------------------------
# Volumes
# -------------------------
volumes:
  mysql_data:
    driver: local
  app_logs:
    driver: local

# -------------------------
# Networks
# -------------------------
networks:
  copo-network:
    driver: bridge
