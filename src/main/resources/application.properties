# =============================================================
# COPO - BASE CONFIGURATION
# Profile-specific overrides in application-{profile}.properties
# Set SPRING_PROFILES_ACTIVE=prod for production deployment
# =============================================================

spring.application.name=copov2

# Active profile: controlled by SPRING_PROFILES_ACTIVE env variable
# Defaults to 'dev' if not set
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# Use Render's/Docker's PORT env variable, otherwise default to 9091
server.port=${PORT:9091}

# =========================
# DATABASE CONFIGURATION (Dev defaults)
# =========================
spring.datasource.url=${DATABASE_URL:jdbc:mysql://localhost:3306/copo3?useSSL=false&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:Root@123}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# =========================
# JPA / HIBERNATE (Dev defaults)
# =========================
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# =========================
# SECURITY (Dev defaults - disabled)
# =========================
spring.security.user.name=disabled
spring.security.user.password=disabled

# =========================
# THYMELEAF CONFIGURATION
# =========================
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.cache=false
spring.mvc.view.prefix=
spring.mvc.view.suffix=

# =========================
# ACTUATOR (Dev: expose all)
# =========================
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always

# =========================
# LOGGING (Dev: verbose)
# =========================
logging.level.root=INFO
logging.level.org.springframework.web=DEBUG
logging.level.com.copo.app=DEBUG

# =========================
# SESSION
# =========================
server.servlet.session.timeout=30m
server.error.include-message=always
server.error.include-stacktrace=always
