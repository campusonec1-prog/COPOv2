# =============================================================
# COPO - PRODUCTION PROFILE
# All sensitive values are read from environment variables.
# =============================================================

spring.application.name=copov2
server.port=${PORT:9091}

# =============================================================
# DATABASE CONFIGURATION
# =============================================================
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Connection Pool (HikariCP) - Production tuned
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.pool-name=COPOHikariPool
spring.datasource.hikari.connection-test-query=SELECT 1

# =============================================================
# JPA / HIBERNATE SETTINGS
# =============================================================
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
# IMPORTANT: Use 'validate' or 'none' in production — never 'create' or 'create-drop'
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# =============================================================
# SECURITY CONFIGURATION
# =============================================================
spring.security.user.name=${ADMIN_USERNAME:admin}
spring.security.user.password=${ADMIN_PASSWORD}

# =============================================================
# THYMELEAF CONFIGURATION
# =============================================================
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
# Disable caching in dev, enable in prod
spring.thymeleaf.cache=true
spring.mvc.view.prefix=
spring.mvc.view.suffix=

# =============================================================
# ACTUATOR / MANAGEMENT ENDPOINTS
# Expose only safe endpoints in production
# =============================================================
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized
management.endpoint.health.show-components=when-authorized
management.endpoints.web.base-path=/actuator
management.server.port=${PORT:9091}
info.app.name=COPO - Course Outcome Process Outcome
info.app.version=2.0.0

# =============================================================
# LOGGING CONFIGURATION
# =============================================================
logging.level.root=${LOG_LEVEL:WARN}
logging.level.org.springframework.web=WARN
logging.level.org.springframework.security=WARN
logging.level.org.hibernate=WARN
logging.level.com.copo.app=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
logging.file.name=/app/logs/copo.log
logging.file.max-size=10MB
logging.file.max-history=7

# =============================================================
# SESSION CONFIGURATION
# =============================================================
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=false
server.servlet.session.cookie.same-site=strict

# =============================================================
# SERVER / TOMCAT SETTINGS
# =============================================================
server.tomcat.max-threads=200
server.tomcat.min-spare-threads=20
server.tomcat.connection-timeout=20000
server.tomcat.accesslog.enabled=false
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-exception=false
server.error.include-binding-errors=never

# Disable student self-registration in production
app.registration.enabled=false
